spring:
  application:
    name: ai-platform
  datasource:
    url: ${AI_METADATA_URL:jdbc:mysql://127.0.0.1:3306/aiplatform?serverTimezone=UTC}
    username: ${AI_METADATA_USERNAME:aiplatform_user}
    password: ${AI_METADATA_PASSWORD:aiplatform_password}
    hikari:
      maximum-pool-size: ${AI_METADATA_POOL_SIZE:5}
  flyway:
    enabled: true
    encoding: UTF-8
  ai:
    openai:
      api-key: ${AI_API_KEY}
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      chat:
        timeout: ${AI_CHAT_TIMEOUT:300s}
        model: ${AI_MODEL:deepseek-v4-flash}
        temperature: 0.2

ai:
  chat:
    memory-max-messages: ${AI_CHAT_MEMORY_MAX_MESSAGES:20}
    stream-timeout: ${AI_CHAT_TIMEOUT:300s}
  auth:
    context-url: ${AI_AUTH_CONTEXT_URL:http://127.0.0.1:8090/internal/api/v1/auth/context}
    internal-service-key: ${AI_AUTH_INTERNAL_SERVICE_KEY:local-sql-editor-key}
    connect-timeout: ${AI_AUTH_CONNECT_TIMEOUT:2s}
    read-timeout: ${AI_AUTH_READ_TIMEOUT:3s}
    cache-ttl: ${AI_AUTH_CACHE_TTL:60s}
    cache-maximum-size: ${AI_AUTH_CACHE_MAXIMUM_SIZE:10000}
  platform:
    application-name: ${spring.application.name}
    environment: ${AI_PLATFORM_ENVIRONMENT:local}
    version: ${AI_PLATFORM_VERSION:0.0.1-SNAPSHOT}
  datasource:
    provider: ${AI_DATASOURCE_PROVIDER:web-sql}
    web-sql:
      base-url: ${WEB_SQL_BASE_URL:http://localhost:8080}
      connect-timeout-seconds: 5
      # query-timeout-seconds + 10; their HTTP layer is timeoutSeconds + 5
      read-timeout-seconds: 20
      max-tables-per-schema-call: 5
      max-listed-tables: 200
      # Empty means no extra ID lock; web-sql Bearer visibility decides access.
      # A non-empty list is a local/emergency restriction.
      allowed-datasource-ids: []
  datasources: {}
  agent:
    database:
      max-rows: 200
      query-timeout-seconds: 10
      max-result-bytes: 1048576
      max-sql-length: 10000
      max-complexity: 12
      include-views: false

semantic:
  mapper:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
