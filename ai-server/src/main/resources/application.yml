spring:
  application:
    name: ai-platform
  ai:
    openai:
      api-key: ${AI_API_KEY}
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      chat:
        model: ${AI_MODEL:deepseek-v4-flash}
        temperature: 0.2

ai:
  platform:
    application-name: ${spring.application.name}
    environment: ${AI_PLATFORM_ENVIRONMENT:local}
    version: ${AI_PLATFORM_VERSION:0.0.1-SNAPSHOT}
  datasource:
    provider: ${AI_DATASOURCE_PROVIDER:web-sql}
    web-sql:
      base-url: ${WEB_SQL_BASE_URL:http://localhost:8080}
      connect-timeout-seconds: 5
      # query-timeout-seconds + 10; their HTTP layer is timeoutSeconds + 5
      read-timeout-seconds: 20
      max-tables-per-schema-call: 5
      max-listed-tables: 200
      allowed-datasource-ids: []
  datasources: {}
  agent:
    database:
      max-rows: 200
      query-timeout-seconds: 10
      max-result-bytes: 1048576
      max-sql-length: 10000
      max-complexity: 12
      include-views: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
